<header class="topbar">
  <div class="topbar-inner">
    <!-- aria-label gives the button a name for screen readers.
         Without it, "👤" is read out as "bust in silhouette". -->
    <button class="profile-btn" aria-label="Open account menu">👤</button>

    <div class="brand">
      <img src="Images/Malebo/Malebo  logo black.jpg" alt="Malebo logo" class="brand-logo" />
    </div>

    <button
      class="nav-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="main-nav"
    >
      ☰
    </button>
  </div>
</header>

<!-- Outside <header> so it can drop down over the page.
     <nav> (not <div>) because these are the site's main links.
     ⚠️ These paths are written from the site's main folder, so they
     work on index.html but not on pages inside pages/ (Lesson 11). -->
<nav class="nav-links" id="main-nav">

  <a href="pages/streak.html">Streak</a>

  <a href="pages/community.html">Community</a>
  <a href="pages/settings.html">Settings</a>
  <a href="pages/panic.html" class="nav-cta">⚡ Panic Button</a>
</nav>

    <a href="#">Profile</a>

    <a href="pages/settings.html">Settings</a>

  </div>
</div>
